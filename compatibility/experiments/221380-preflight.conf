# Age of Empires II (2013) - owned-history D3D9 validation candidate.
#
# Valve's store metadata declares Windows only. In a historical authenticated
# Windows Steam install, the cache named Launcher.exe as the public launch
# target and aok hd.exe as the real game candidate; that installed game's
# aok hd.exe was PE32/i386 at BuildID 3062235. The current independent
# AppID 221380 prefix has no game payload, so these pinned manifests must be
# revalidated after acquisition. Keep the profile experimental: the historical
# retired IE launcher crashed, a Steam-tracked DXVK bridge reached a
# swapchain but presented black, and WineD3D exited before a window.
# A future staged launcher-bypass transform must avoid mutating Steam's tree.
schema=1
appid=221380
windows_depots=221381:1823527930179156287,221382:8783723155641077818,239550:6575436136788878528,221385:4586626103938331242,221389:3733794809018747474,221395:8605037657018259986,355950:495816626342536223
windows_payload_root=steam-installed-tree
runtime=macroton-winehq-macos
runtime_version=11.14
renderer=wined3d-opengl
graphics_api=d3d9
launch=steam
steam_install_dir=Age2HD
steam_launcher_bypass=Launcher.exe
windows_build_id=3062235
executable=aok hd.exe
arguments=NoStartUp
env.WINEDEBUG=-all
# The named single-player slot is created in-game for acceptance, synced once
# as the baseline, then overwritten in-game for the fresh Cloud roundtrip.
cloud_files=Profiles/Player.nfp|steam-install:Profiles/Player.nfp;Profiles/player0.hki|steam-install:Profiles/player0.hki;SaveGame/Macroton-Acceptance.aoe2spgame|steam-install:SaveGame/Macroton-Acceptance.aoe2spgame
