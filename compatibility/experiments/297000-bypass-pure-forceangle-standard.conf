# Heroes III 2D handoff A/B: standard Windows Steam client, pure Wine.
# Compared with 297000-bypass-pure-forceangle.conf, only the Steam client mode
# changes; the payload, renderer and isolated-prefix contract stay
# identical.
schema=1
appid=297000
windows_depots=297001:577159939575601416,297002:5370924995944324406
windows_payload_root=steam-installed-tree
runtime=macroton-winehq-pure
runtime_version=11.14
renderer=wined3d-opengl
graphics_api=d3d9
launch=steam
steam_client_mode=standard
steam_install_dir=Heroes of Might & Magic III - HD Edition
windows_build_id=575501
executable=HOMM3 2.0.exe
steam_launcher_bypass=HOMM3Launcher.exe
arguments=--fromLauncher --version 2.0
env.WINEDEBUG=-all
env.SDL_RENDER_DRIVER=opengl
