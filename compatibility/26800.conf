# Braid (2009) - legacy Win32 D3D9 Effects validation target.
#
# Wine's builtin D3DX compiler cannot compile Braid's fx_2_0 effects. Steam's
# DirectX install script supplies the redistributable DLLs; both layers must be
# selected together. WineD3D's Vulkan path renders the jigsaw screen with a
# severe red tint on Apple Silicon, while the OpenGL path renders it correctly.
# Keep the game's default VSync. Removing -no_vsync reduced frame variance in a
# short capture, but a later user-focused playtest still observed flicker. The
# temporal regression therefore remains open; do not treat VSync alone as a fix.
schema=1
appid=26800
windows_depot_id=26801
windows_payload_root=steam-installed-tree
runtime=macroton-winehq-macos
runtime_version=11.14
renderer=wined3d-opengl
graphics_api=d3d9
launch=steam
steam_client_mode=standard
steam_install_dir=Braid
windows_build_id=725784
windows_depot_manifest_id=9092530849713788234
executable=braid.exe
arguments=-no_launcher -windowed
cloud_files=slot_0.braid_campaign|AppData/Roaming/Braid/slot_0.braid_campaign
env.WINEDLLOVERRIDES=d3dx9_43=n,b;d3dcompiler_43=n,b
env.WINEDEBUG=-all
