# Silver (1999) - first real Macroton compatibility target.
# The Steam overlay renderer hangs during audio initialization under public
# Wine. Macroton disables that optional DLL injection while preserving Steam
# ownership checks and Steamworks initialization. Explicit WineD3D/OpenGL is
# pinned because it improves the interactive 3D/menu path and audio. The OGV
# intro remains grayscale under both WineD3D and the SDL software experiment;
# that video presentation defect is still an open compatibility gate.
